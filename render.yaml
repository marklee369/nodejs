services:
  - type: web
    name: ssh-gateway-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      - fromGroup: backend-secrets

      - key: TRUST_PROXY_HOPS
        value: "1"

      - key: ALLOW_PRIVATE_TARGETS
        value: "true"

      - key: REQUIRE_HOST_FINGERPRINT
        value: "false"
